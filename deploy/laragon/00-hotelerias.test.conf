# =========================================================
# Hotelerias en Laragon:  http://hotelerias.test/
#
# Copiar a  C:\laragon\etc\apache2\sites-enabled\  y recargar Apache
# (Laragon > Menu > Apache > Reload). Ver deploy/laragon/README.md.
#
# El prefijo "00-" es a proposito: carga ANTES que el auto.Hotelerias.test.conf
# que genera Laragon (que apunta a la carpeta del proyecto, no a dist/) y asi
# este es el que atiende el nombre. Mismo patron que 00-ecommerce.test.conf.
# =========================================================
<VirtualHost *:80>
    DocumentRoot "C:/laragon/www/Hotelerias/frontend/dist"
    ServerName Hotelerias.test
    ServerAlias *.Hotelerias.test

    <Directory "C:/laragon/www/Hotelerias/frontend/dist">
        Options -Indexes
        AllowOverride None
        Require all granted

        # SPA: toda ruta que no sea un archivo cae en index.html (React Router).
        # Sin esto, abrir directo /config/usuarios o refrescar daria 404.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    # La API en Go (carpeta backend) escucha en el puerto 5220 (Server.Port del
    # config.yaml; es el mismo al que apunta el proxy de Vite en desarrollo).
    # Ecommerce usa 8081 y Minimarket 8080.
    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:5220/api
    ProxyPassReverse /api http://127.0.0.1:5220/api

    # Archivos subidos (logo, fotos): el frontend los pide en /uploads/...
    ProxyPass /uploads http://127.0.0.1:5220/uploads
    ProxyPassReverse /uploads http://127.0.0.1:5220/uploads
</VirtualHost>
