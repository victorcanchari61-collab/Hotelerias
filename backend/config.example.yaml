# Copia este archivo a config.yaml y ajusta. config.yaml NO se versiona.
#
#   cp config.example.yaml config.yaml
#
# Los secretos (clave JWT, contraseña de la base, token de ApisPeru) conviene
# dejarlos en un archivo .env y no aquí: ver .env.example. Cualquier valor de
# este archivo se puede pisar con una variable de entorno ("." se vuelve "_",
# en mayúsculas); el entorno real gana sobre el .env, y el .env sobre este YAML.
Server:
  Port: 5220            # sin los dos puntos; el proxy de Vite apunta a 5220
  UploadsDir: "uploads" # carpeta de logo y fotos, servida en /uploads
AllowedOrigins:
  - "http://localhost:5173"
  - "http://localhost:4173"
  - "http://localhost:4200"
ConnectionStrings:
  # URL o pares clave=valor. El formato "Host=...;Port=..." (Npgsql) no sirve.
  PostgreSQL: "host=localhost port=5432 dbname=hoteleria user=postgres password=CAMBIAR"
  Redis: "localhost:6379"
  MongoDB: "mongodb://localhost:27017"
MongoDBSettings:
  DatabaseName: "hoteleria_logs"
JwtSettings:
  # Mínimo 32 bytes. Genera una con: openssl rand -base64 48
  SecretKey: "CAMBIAR_POR_UNA_CLAVE_LARGA_Y_ALEATORIA_DE_AL_MENOS_32_BYTES"
  Issuer: "Hoteleria"
  Audience: "HoteleriaClient"
  ExpirationHours: 8
ApisPeru:
  Url: "https://dniruc.apisperu.com/api/v1"
  Token: "CAMBIAR"
# Super administrador: se crea UNA vez al arrancar si no existe (acceso a todo).
# El correo y el nombre pueden ir aqui; la CONTRASENA va solo en .env como
# ADMININICIAL_PASSWORD (minimo 10 caracteres). Sin contrasena no se crea y no
# hay ninguna por defecto. Si la cuenta ya existe, cambiarla aqui no la modifica.
AdminInicial:
  Email: "admin@hotelerias.test"
  Nombre: "Super Admin"
